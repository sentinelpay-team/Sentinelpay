name: SentinelPay CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  test-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Confirm workflow is running
        run: |
          echo "SentinelPay GitHub Actions pipeline is working" | tee workflow-smoke-test.txt

      - name: Upload workflow smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-smoke-test
          path: workflow-smoke-test.txt

  security-scans:
    name: Application Security Scans
    uses: ./.github/workflows/security-scans.yml

  infrastructure-security:
    name: Infrastructure Security
    uses: ./.github/workflows/infrastructure-security.yml

  container-security:
    name: Container Security
    uses: ./.github/workflows/container-security.yml

  policy-checks:
    name: Policy as Code
    uses: ./.github/workflows/policy-checks.yml
