name: SentinelPay CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  test-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Confirm workflow is running
        run: echo "SentinelPay GitHub Actions pipeline is working"

  security-scans:
    name: Application Security Scans
    uses: ./.github/workflows/security-scans.yml

  infrastructure-security:
    name: Infrastructure Security
    uses: ./.github/workflows/infrastructure-security.yml

  container-security:
    name: Container Security
    uses: ./.github/workflows/container-security.yml

  policy-checks:
    name: Policy as Code
    uses: ./.github/workflows/policy-checks.yml
