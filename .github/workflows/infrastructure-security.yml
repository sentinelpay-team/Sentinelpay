name: Reusable Infrastructure Security

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:

  checkov:
    name: Checkov Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            -d infra \
            --framework terraform \
            --soft-fail \
            --hard-fail-on CKV_AWS_145,CKV_AWS_16,CKV_AWS_17,CKV2_AWS_28,CKV_AWS_2,CKV2_AWS_20,CKV_AWS_103,CKV2_AWS_3,CKV_AWS_238,CKV2_AWS_11 \
            --compact

  tfsec:
    name: tfsec Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install tfsec
        run: |
          TFSEC_VERSION="v1.28.13"
          curl -sSL \
            "https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}/tfsec-linux-amd64" \
            -o tfsec

          chmod +x tfsec
          sudo mv tfsec /usr/local/bin/tfsec

          tfsec --version

      - name: Run tfsec
        run: |
          tfsec infra \
            --minimum-severity HIGH \
            --no-colour

  aws-oidc-test:
    name: Test AWS OIDC Authentication
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity
