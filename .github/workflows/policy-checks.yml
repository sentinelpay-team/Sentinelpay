name: Reusable Policy Checks

on:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:

  conftest:
    name: OPA Conftest Policy Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Check for Terraform files
        id: terraform_check
        run: |
          if find infra -type f -name "*.tf" | grep -q .; then
            echo "terraform_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "terraform_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.terraform_check.outputs.terraform_present == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Install Conftest
        if: steps.terraform_check.outputs.terraform_present == 'true'
        run: |
          wget https://github.com/open-policy-agent/conftest/releases/download/v0.62.0/conftest_0.62.0_Linux_x86_64.tar.gz
          tar xzf conftest_0.62.0_Linux_x86_64.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: Terraform Init
        if: steps.terraform_check.outputs.terraform_present == 'true'
        working-directory: infra/environments/dev
        run: terraform init

      - name: Terraform Validate
        if: steps.terraform_check.outputs.terraform_present == 'true'
        working-directory: infra/environments/dev
        run: terraform validate

      - name: Terraform Plan
        if: steps.terraform_check.outputs.terraform_present == 'true'
        working-directory: infra/environments/dev
        run: terraform plan -out=plan.out

      - name: Run Conftest Policies
        if: steps.terraform_check.outputs.terraform_present == 'true'
        working-directory: infra/environments/dev
        run: |
          terraform show -json plan.out | conftest test - \
            --policy ../../../policy/terraform \
            --all-namespaces \
            --output json > conftest-report.json

      - name: Upload Conftest report
        if: always() && steps.terraform_check.outputs.terraform_present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: conftest-policy-report
          path: infra/environments/dev/conftest-report.json
